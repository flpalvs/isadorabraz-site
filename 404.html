<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada | Isadora Braz</title>
<link rel="icon" href="/assets/mark-dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#EFEDE4;--sage:#ABBC91;--ink:#222B14;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--gut:clamp(20px,4.4vw,80px)}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--ink);color:var(--cream);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
header{padding:28px var(--gut)}
header a{display:inline-flex;align-items:center;gap:12px;font:400 26px/1 var(--serif);color:var(--cream);text-decoration:none}
header img{width:44px;height:auto}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:28px;padding:0 var(--gut) 8vh}
.code{font:300 clamp(18px,2vw,24px)/1 var(--serif);font-style:italic;color:var(--sage);letter-spacing:.04em}
h1{font:300 clamp(48px,9vw,150px)/.95 var(--serif);letter-spacing:-.03em;text-wrap:balance}
h1 em{color:var(--sage)}
p{max-width:34ch;color:rgba(239,237,228,.8);font-size:clamp(17px,1.5vw,20px)}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:14px 30px;border-radius:999px;background:var(--cream);color:var(--ink);font:500 16px/1 var(--sans);text-decoration:none;transition:background-color .4s}
.btn:hover{background:var(--sage)}
.btn svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--sage);outline-offset:3px;border-radius:6px}
</style>
</head>
<body>
<header><a href="/" translate="no"><img src="/assets/mark-sage.png" alt="" width="230" height="196">Isadora Braz</a></header>
<main>
  <span class="code">Erro 404</span>
  <h1>Esta página <em>não foi encontrada.</em></h1>
  <p>O endereço pode ter mudado ou não existir mais. Volte ao início para continuar.</p>
  <a class="btn" href="/">Voltar ao início
    <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</main>
</body>
</html>
